# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # ۱. راه‌اندازی پایتون برای nbconvert و اسکریپت کوچک‌کردن آرتیفکت
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ۲. نصب Jupyter Book 2 (موتور MyST)
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book

      # ۳. نصب nbconvert برای ساخت اسلایدهای reveal.js
      - name: Install nbconvert
        run: pip install nbconvert

      # ۴. ساخت کتاب
      - name: Build HTML Assets
        run: jupyter-book build --html

      # ۵. ساخت اسلایدها در زیرپوشه‌ای از خروجی سایت
      #    فهرست نوتبوک‌ها با find ساخته می‌شود: با glob پیش‌فرض bash، الگوی
      #    `notebooks/**/*.ipynb` عملاً به `notebooks/*/*.ipynb` تبدیل می‌شود و
      #    اگر روزی نوتبوکی یک سطح پایین‌تر برود، بی‌صدا از قلم می‌افتد.
      #    خروجی‌های ساخت قبلی (`notebooks/_build`) و پوشه‌های checkpoints هم
      #    کنار گذاشته می‌شوند تا نسخه‌های تکراری ساخته نشوند.
      # - name: Build Slides
      #   run: |
      #     mkdir -p _build/html/slides
      #     mapfile -t notebooks < <(
      #       find notebooks -name '*.ipynb' \
      #         -not -path '*/.ipynb_checkpoints/*' \
      #         -not -path 'notebooks/_build/*' | sort
      #     )
      #     echo "Converting ${#notebooks[@]} notebooks to slides."
      #     jupyter nbconvert --to slides "${notebooks[@]}" \
      #       --output-dir _build/html/slides/ \
      #       --reveal-prefix "https://cdn.jsdelivr.net/npm/reveal.js@4"
      #     # تصاویر نوتبوک‌ها با مسیر نسبی img/... ارجاع داده می‌شوند (بنر و
      #     # شکل‌های ذخیره‌شده)، بنابراین کنار فایل‌های .slides.html کپی می‌شوند.
      #     if [ -d notebooks/img ]; then cp -r notebooks/img _build/html/slides/img; fi

      # ۶. کوچک‌کردن آرتیفکت
      #    myst برای هر صفحه یک کپی از نوتبوک در build/ می‌گذارد تا دکمهٔ
      #    «Download as ipynb» کار کند. این کپی‌ها بایت‌به‌بایت همان فایل‌های
      #    مخزن‌اند؛ اسکریپت، لینک‌ها را به همان فایل در GitHub وصل می‌کند و بعد
      #    کپی را حذف می‌کند — نه زودتر، پس لینکی ۴۰۴ نمی‌شود.
      - name: Prune artifact
        run: |
          python tools/prune_site.py
          du -sh _build/html

      # ۷. آپلود کل خروجی (کتاب + اسلایدها)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
